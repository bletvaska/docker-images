# input and output
from: markdown
to: epub
output-file: download/labs.epub

# templating
template: epub-labs.html
# standalone: true

# citations
# citeproc: true
# csl: ieee
# bibliography:
# - bibliography.bib


# filters
filters:
- alerts.lua
- number-tasks.lua
- images-counter.lua

# toc
table-of-contents: true
toc-depth: 2

# syntax highlighting
highlight-style: tango

# math support
html-math-method:
  method: mathjax
  # url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"


metadata-files:
- metadata-labs.yaml

# css styles
css:
- /app/pandoc/styles/epub.css