{%- comment -%}
Zvacsenie obrazkov po kliknuti (GLightbox, https://github.com/biati-digital/glightbox).

Obrazky v <figure> su aj s popiskom zarovnane na stred a na stranke sa
zmensia najviac na polovicu sirky okna (na mobile na sirku textu) a na
vysku 60 % okna. Obrazky maju biele pozadie, aby
boli obrazky s priehladnym pozadim citatelne aj v tmavom rezime a v nahlade.
Ak je obrazok takto zmenseny, kliknutim sa otvori v povodnej velkosti aj
s popiskom z <figcaption>. SVG obrazok sa da zvacsit vzdy a v nahlade sa
roztiahne na velkost okna. Triedy .wide-100 a .wide-75 ({.wide-100} za
obrazkom v Markdowne) zobrazia obrazok na celu sirku textu, resp. na 75 %. Nahlad sa zatvori klavesom ESC, kliknutim na
obrazok, mimo neho alebo na X.

Pouzitie: {% include lightbox.html %} na konci <body> v layoute.
{%- endcomment -%}

<style>
    main figure img {
        display: block;
        margin-left: auto;
        margin-right: auto;
        /* najviac polovica sirky okna (nie bloku, aby obrazky v stlpcoch
           neboli prilis male), no nikdy nie sirsie ako blok */
        max-width: min(100%, 50vw);
        max-height: 60vh;
        height: auto;
    }

    /* siroke obrazky (napr. pinout): ![popis](obrazok.svg){.wide-100} zaberie
       celu sirku textu, {.wide-75} 75 % sirky textu; vyskou okna nie su
       obmedzene */
    main figure img.wide-100,
    main figure.wide-100 img {
        width: 100%;
        max-width: 100%;
        max-height: none;
    }

    main figure img.wide-75,
    main figure.wide-75 img {
        width: 75%;
        max-width: 75%;
        max-height: none;
    }

    /* na uzkych obrazovkach (mobil) by polovica okna bola primalo */
    @media (max-width: 767.98px) {
        main figure img,
        main figure img.wide-75,
        main figure.wide-75 img {
            width: auto;
            max-width: 100%;
        }
    }

    /* biele pozadie pre obrazky s priehladnym pozadim (diagramy), aby boli
       citatelne v tmavom rezime aj v nahlade s tmavym pozadim */
    main figure img,
    .glightbox-container .gslide-image img {
        background-color: #fff;
    }

    [data-bs-theme="dark"] main figure img,
    .glightbox-container .gslide-image img {
        padding: 0.5rem;
        border-radius: 0.375rem;
    }

    main figure figcaption {
        text-align: center;
    }

    main figure img.zoomable {
        cursor: zoom-in;
    }

    /* SVG v nahlade: 95 % sirky okna, najviac 80 % vysky (zvysok je pre
       popisok); --svg-ratio nastavuje skript nizsie */
    .glightbox-container .gslide-image img.svg {
        width: min(95vw, calc(80vh * var(--svg-ratio, 1.5))) !important;
        height: auto !important;
        max-width: none !important;
        max-height: none !important;
    }

    /* sirku pri tlaci urcuje print.css */
    @media print {
        main figure img {
            max-height: none;
        }
    }
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.1/css/glightbox.min.css"
      integrity="sha512-T+KoG3fbDoSnlgEXFQqwcTC9AdkFIxhBlmoaFqYaIjq2ShhNwNao9AKaLUPMfwiBPL0ScxAtc+UYbHAgvd+sjQ=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.1/js/glightbox.min.js"
        integrity="sha512-XL54SjceXZFzblziNnaFFaXggzqCuZrFS4loWPpvPJ6Kg0kc2HyL89+cPeH0GMq0sKL2SegzUmA8Lx9a0st2ow=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
// az po 'load', aby boli zname skutocne rozmery obrazkov
window.addEventListener('load', function () {
    var main = document.querySelector('main');
    if (!window.GLightbox || !main) return;

    // pomer stran SVG obrazkov podla adresy, aby sa dali v nahlade roztiahnut
    var svgRatios = {};

    document.querySelectorAll('main figure img').forEach(function (img) {
        var src = img.currentSrc || img.src;
        // SVG je vektor, zvacsit ho ma zmysel vzdy (a SVG bez width/height
        // atributov ani nema skutocnu prirodzenu velkost)
        var isSvg = /\.svg([?#].*)?$/i.test(src);

        // obrazok, ktory sa zmesti na stranku, netreba zvacsovat
        if (!isSvg && img.naturalWidth <= img.clientWidth && img.naturalHeight <= img.clientHeight) return;

        if (isSvg && img.naturalWidth && img.naturalHeight) {
            svgRatios[src] = img.naturalWidth / img.naturalHeight;
        }

        img.classList.add('zoomable');
    });

    // obrazky a diagramy v poradi na stranke; zoznam sa zostavuje az pri
    // kliknuti, lebo Mermaid kresli diagramy asynchronne a prekresluje ich
    // pri zmene rezimu; diagram sa vklada ako kopia <svg>, nie <img>, lebo
    // popisy v <foreignObject> by sa v obrazku nevykreslili
    function collect() {
        var gallery = { nodes: [], elements: [] };

        main.querySelectorAll('figure img.zoomable, div.mermaid').forEach(function (node) {
            var figure = node.closest('figure');
            var caption = figure && figure.querySelector('figcaption');
            var description = caption ? caption.innerHTML : '';

            if (node.matches('img')) {
                gallery.elements.push({
                    href: node.currentSrc || node.src,
                    type: 'image',
                    description: description
                });
            } else {
                var svg = node.querySelector('svg');
                if (!svg) return;
                gallery.elements.push({
                    content: '<div class="mermaid-zoom">' + svg.outerHTML + '</div>',
                    width: '96vw',
                    height: 'auto',
                    description: description
                });
            }

            gallery.nodes.push(node);
        });

        return gallery;
    }

    main.addEventListener('click', function (event) {
        var node = event.target.closest('img.zoomable, div.mermaid');
        if (!node) return;

        var gallery = collect();
        var index = gallery.nodes.indexOf(node);
        if (index === -1) return;

        var lightbox = GLightbox({
            elements: gallery.elements,
            zoomable: false,
            loop: false
        });

        lightbox.on('slide_after_load', function (data) {
            var img = data.slideNode.querySelector('img');
            if (!img) return;

            // SVG sa v nahlade roztiahne na velkost okna, nie na svoju prirodzenu
            // velkost; rozmery urcuje CSS (.gslide-image img.svg), lebo GLightbox
            // atribut style obrazka pri kazdom prepocte prepise, a pomer stran
            // je preto ulozeny na slide, ktory GLightbox nemeni
            var ratio = svgRatios[img.currentSrc || img.src];
            if (ratio) {
                data.slideNode.style.setProperty('--svg-ratio', ratio);
                img.classList.add('svg');
                lightbox.resize();
            }

            // kliknutie na zvacseny obrazok nahlad zatvori
            img.addEventListener('click', function () { lightbox.close(); });
        });

        lightbox.on('close', function () { lightbox.destroy(); });
        lightbox.openAt(index);
    });
});
</script>
